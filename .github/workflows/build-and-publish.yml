name: Build and Publish kea-dhcp4 Container Image

on:
  push:
    branches:
      - main
      - master
    paths:
      # Rebuild when the image inputs or this workflow change
      - "Dockerfile"
      - "kea-dhcp4.conf"
      - "hiddens"
      - ".github/workflows/build-and-publish.yml"
  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adaricorp/kea-dhcp4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Single source of truth: the pinned `ARG VERSION=` in the Dockerfile.
      # Renovate bumps it (docker datasource on ISC's cloudsmith kea-dhcp4),
      # and BOTH the apk install (isc-kea-dhcp4~=${VERSION}) and the published
      # image tag derive from it, so the tag can never drift from the binaries.
      - name: Determine Kea version from Dockerfile
        id: version
        run: |
          version="$(grep -oP '^ARG VERSION=\K.*' Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::Could not read 'ARG VERSION=' from Dockerfile"
            exit 1
          fi
          echo "kea=$version" >> "$GITHUB_OUTPUT"
          echo "kea_minor=$(echo "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "Building kea-dhcp4 $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Exact kea version (what adarigod pins)
            type=raw,value=${{ steps.version.outputs.kea }}
            # Floating major.minor for humans (e.g. 3.2)
            type=raw,value=${{ steps.version.outputs.kea_minor }}
            # latest on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Short commit SHA for traceability
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass VERSION explicitly so the installed packages match the tag even
          # if the Dockerfile default is ever edited out of step with this build.
          build-args: |
            VERSION=${{ steps.version.outputs.kea }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed successfully!"
