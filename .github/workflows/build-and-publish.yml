name: Build and Publish Kea Container Images

on:
  push:
    branches:
      - main
      - master
    paths:
      # Rebuild when any component's inputs or this workflow change
      - "kea-dhcp4/**"
      - "kea-dhcp6/**"
      - ".github/workflows/build-and-publish.yml"
  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One published image per Kea component; the directory name IS the
        # image name (ghcr.io/adaricorp/<component>).
        component: [kea-dhcp4, kea-dhcp6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Single source of truth: the pinned `ARG VERSION=` in each component's
      # Dockerfile. Renovate bumps them (docker datasource on ISC's cloudsmith
      # images), and BOTH the apk install (isc-kea-dhcpN~=${VERSION}) and the
      # published image tag derive from it, so the tag can never drift from the
      # binaries.
      - name: Determine Kea version from Dockerfile
        id: version
        run: |
          version="$(grep -oP '^ARG VERSION=\K.*' '${{ matrix.component }}/Dockerfile')"
          if [ -z "$version" ]; then
            echo "::error::Could not read 'ARG VERSION=' from ${{ matrix.component }}/Dockerfile"
            exit 1
          fi
          echo "kea=$version" >> "$GITHUB_OUTPUT"
          echo "kea_minor=$(echo "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.component }} $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/adaricorp/${{ matrix.component }}
          tags: |
            # Exact kea version (what adarigod pins)
            type=raw,value=${{ steps.version.outputs.kea }}
            # Floating major.minor for humans (e.g. 3.2)
            type=raw,value=${{ steps.version.outputs.kea_minor }}
            # latest on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Short commit SHA for traceability
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          # Pass VERSION explicitly so the installed packages match the tag even
          # if a Dockerfile default is ever edited out of step with this build.
          build-args: |
            VERSION=${{ steps.version.outputs.kea }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "${{ matrix.component }} pushed successfully!"
